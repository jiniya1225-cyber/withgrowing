<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>소감 남기기 | WithGrowing</title>
  <meta name="robots" content="noindex">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="/css/style.css">
  <style>
    body { background: var(--soft); }
    .page { max-width: 560px; margin: 0 auto; padding: 32px 16px 48px; }
    .page h1 { font-size: 28px; font-weight: 800; margin: 10px 0 8px; }
    .page .lead { color: var(--muted); margin-bottom: 24px; }
    .done { text-align: center; padding: 40px 24px; }
    .done h2 { font-size: 24px; font-weight: 800; margin-bottom: 10px; }
  </style>
</head>
<body>
  <main class="page">
    <p class="logo">With<span>Growing</span></p>
    <h1>오늘 수업, 어떠셨나요?</h1>
    <p class="lead">느낀 점을 한두 줄로 남겨 주세요. 이름은 적지 않아도 괜찮아요.</p>

    <form class="form" id="fb-form" novalidate>
      <div class="field">
        <label for="fb-topic">어떤 수업이었나요?</label>
        <select id="fb-topic">
          <option value="멘탈코칭">멘탈코칭</option>
          <option value="기업가정신">기업가정신</option>
          <option value="진로">진로</option>
          <option value="사회정서">사회정서</option>
          <option value="역량(부모교육)">역량(부모교육)</option>
          <option value="기타">기타</option>
        </select>
      </div>
      <div class="field">
        <label for="fb-msg">소감 <span class="req">*</span></label>
        <textarea id="fb-msg" maxlength="1000" placeholder="새롭게 알게 된 것, 기억에 남는 활동, 달라진 마음 등" required></textarea>
      </div>
      <div class="field">
        <label for="fb-name">이름 또는 별칭 <span class="hint">(선택)</span></label>
        <input type="text" id="fb-name" maxlength="30" placeholder="예: 중2 학생, 김○○ 학부모">
      </div>
      <div class="trap" aria-hidden="true">
        <label for="fb-website">웹사이트</label>
        <input type="text" id="fb-website" tabindex="-1" autocomplete="off">
      </div>
      <label class="check">
        <input type="checkbox" id="fb-public">
        <span>(선택) 이 소감을 WithGrowing 사이트에 소개해도 좋아요. 적어 주신 이름 또는 별칭과 함께 보일 수 있어요.</span>
      </label>
      <div class="msg" id="fb-msgbox" role="status" hidden></div>
      <button class="btn btn-primary" type="submit" id="fb-submit">소감 보내기</button>
    </form>

    <div class="card done" id="fb-done" hidden>
      <h2>고맙습니다!</h2>
      <p style="color:var(--muted)">남겨 주신 소감은 다음 수업을 더 좋게 만드는 데 쓰여요.</p>
    </div>
  </main>

  <script>
    (function () {
      const form = document.getElementById('fb-form');
      const box = document.getElementById('fb-msgbox');
      const btn = document.getElementById('fb-submit');
      const v = (id) => document.getElementById(id).value.trim();

      // 수업 QR 주소에 ?topic=진로 처럼 붙이면 수업이 미리 골라진다
      const t = new URLSearchParams(location.search).get('topic');
      if (t) {
        const sel = document.getElementById('fb-topic');
        const opt = [...sel.options].find((o) => o.value.startsWith(t));
        if (opt) sel.value = opt.value;
      }

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const data = {
          topic: v('fb-topic'),
          message: v('fb-msg'),
          display_name: v('fb-name'),
          website: v('fb-website'),
          public_ok: document.getElementById('fb-public').checked,
        };
        if (!data.message) { box.textContent = '소감을 적어 주세요'; box.className = 'msg err'; box.hidden = false; return; }
        btn.disabled = true; btn.textContent = '보내는 중…';
        try {
          const r = await fetch('/api/feedback', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data) });
          const j = await r.json().catch(() => ({}));
          if (!r.ok) throw new Error(j.error || '보내지 못했어요. 잠시 뒤 다시 시도해 주세요.');
          form.hidden = true;
          document.getElementById('fb-done').hidden = false;
        } catch (err) {
          box.textContent = err.message; box.className = 'msg err'; box.hidden = false;
          btn.disabled = false; btn.textContent = '소감 보내기';
        }
      });
    })();
  </script>
</body>
</html>
